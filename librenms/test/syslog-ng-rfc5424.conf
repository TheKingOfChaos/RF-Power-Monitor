# Included by the LibreNMS image's syslog-ng.conf (@include "/data/syslog-ng/*.conf").
#
# The RF-Power-Monitor sends RFC 5424 syslog. The image's port 514 source parses the older
# RFC 3164 format, which reads the version digit as the program and loses the hostname, so the
# device's messages go to UDP 5140 here, parsed as RFC 5424 (flags(syslog-protocol)).
#
# Docker Desktop replaces the sender's address with its own, so LibreNMS could not tell which
# device a message came from. Keep the HOSTNAME from the message instead: the device sends its
# hostname, which is its sysName, and LibreNMS matches devices by sysName.
options {
    keep_hostname(yes);
};

source s_rfc5424 {
    udp(ip(0.0.0.0), port(5140), flags(syslog-protocol));
};

log {
    source(s_rfc5424);
    destination(d_librenms);
};
