modules:
    os:
        sysDescr_regex: '/^RF-UPS-Monitor (?<version>[0-9][0-9.]*) .*\((?<hardware>[^)]+)\)/'
    sensors:
        state:
            data:
                -
                    oid: RF-UPS-MONITOR-MIB::mainsPowerStatus
                    num_oid: '.1.3.6.1.4.1.63050.1.{{ $index }}'
                    descr: 'Mains power'
                    index: 'mainsPowerStatus.{{ $index }}'
                    state_name: mainsPowerStatus
                    states:
                        - { descr: lost, value: 0, generic: 2 }
                        - { descr: present, value: 1, generic: 0 }
        temperature:
            data:
                -
                    oid: RF-UPS-MONITOR-MIB::cpuTemperature
                    num_oid: '.1.3.6.1.4.1.63050.4.{{ $index }}'
                    descr: 'CPU (RP2040 die)'
                    # The object was named boardTemperature; the old index keeps the graph history
                    index: 'boardTemperature.{{ $index }}'
                    divisor: 10
                    # Without low_limit LibreNMS sets one 10 degrees below the first reading,
                    # which alarms when the room cools; -20 C is the RP2040's minimum rating
                    low_limit: -20
                    warn_limit: 60
                    high_limit: 70
                -
                    # Only discovered when the TMP1075 answers (carrier board)
                    oid: RF-UPS-MONITOR-MIB::ambientTemperature
                    num_oid: '.1.3.6.1.4.1.63050.5.{{ $index }}'
                    descr: 'Ambient (TMP1075)'
                    index: 'ambientTemperature.{{ $index }}'
                    divisor: 10
                    low_limit: -20
                    warn_limit: 40
                    high_limit: 50
        count:
            data:
                -
                    oid: RF-UPS-MONITOR-MIB::mainsPowerChanges
                    num_oid: '.1.3.6.1.4.1.63050.2.{{ $index }}'
                    descr: 'Mains power changes since boot'
                    index: 'mainsPowerChanges.{{ $index }}'
