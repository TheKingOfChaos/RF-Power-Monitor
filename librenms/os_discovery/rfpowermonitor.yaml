modules:
    os:
        sysDescr_regex: '/^RF-Power-Monitor (?<version>[0-9][0-9.]*) .*\((?<hardware>[^)]+)\)/'
        # The flash chip's unique ID (3.1.0 and later); older firmware has no ENTITY-MIB and leaves it empty
        serial: ENTITY-MIB::entPhysicalSerialNum.1
    sensors:
        state:
            data:
                -
                    oid: RF-POWER-MONITOR-MIB::mainsPowerStatus
                    num_oid: '.1.3.6.1.4.1.63050.1.{{ $index }}'
                    descr: 'Mains power'
                    index: 'mainsPowerStatus.{{ $index }}'
                    state_name: mainsPowerStatus
                    # Warning, not critical: a short outage must not alert; mainsPowerAlarm does
                    states:
                        - { descr: lost, value: 0, generic: 1 }
                        - { descr: present, value: 1, generic: 0 }
                -
                    # Critical once mains has been lost for 60 s ("State Sensor Critical" alerts on it)
                    oid: RF-POWER-MONITOR-MIB::mainsPowerAlarm
                    num_oid: '.1.3.6.1.4.1.63050.6.{{ $index }}'
                    descr: 'Mains lost over 60 s'
                    index: 'mainsPowerAlarm.{{ $index }}'
                    state_name: mainsPowerAlarm
                    states:
                        - { descr: none, value: 0, generic: 0 }
                        - { descr: lostTooLong, value: 1, generic: 2 }
                -
                    # Warning while a new firmware is on trial: it is kept once it answers a valid request
                    oid: RF-POWER-MONITOR-MIB::fwState
                    num_oid: '.1.3.6.1.4.1.63050.7.4.{{ $index }}'
                    descr: 'Firmware'
                    index: 'fwState.{{ $index }}'
                    state_name: fwState
                    states:
                        - { descr: kept, value: 1, generic: 0 }
                        - { descr: trial, value: 2, generic: 1 }
                -
                    # Shown on the Overview page with the other sensors; warning after a rollback or fallback
                    oid: RF-POWER-MONITOR-MIB::fwLastResult
                    num_oid: '.1.3.6.1.4.1.63050.7.5.{{ $index }}'
                    descr: 'Firmware last update'
                    index: 'fwLastResult.{{ $index }}'
                    state_name: fwLastResult
                    states:
                        - { descr: none, value: 0, generic: 0 }
                        - { descr: installed, value: 1, generic: 0 }
                        - { descr: rolledBackCrash, value: 2, generic: 1 }
                        - { descr: rolledBackUnreachable, value: 3, generic: 1 }
                        - { descr: fallbackCrash, value: 4, generic: 1 }
        temperature:
            data:
                -
                    oid: RF-POWER-MONITOR-MIB::cpuTemperature
                    num_oid: '.1.3.6.1.4.1.63050.4.{{ $index }}'
                    descr: 'CPU (RP2040 die)'
                    # The object was named boardTemperature; the old index keeps the graph history
                    index: 'boardTemperature.{{ $index }}'
                    divisor: 10
                    # Without low_limit LibreNMS sets one 10 degrees below the first reading,
                    # which alarms when the room cools; -20 C is the RP2040's minimum rating
                    low_limit: -20
                    warn_limit: 60
                    high_limit: 70
                -
                    # Only discovered when the TMP1075 answers (carrier board)
                    oid: RF-POWER-MONITOR-MIB::ambientTemperature
                    num_oid: '.1.3.6.1.4.1.63050.5.{{ $index }}'
                    descr: 'Ambient (TMP1075)'
                    index: 'ambientTemperature.{{ $index }}'
                    divisor: 10
                    low_limit: -20
                    warn_limit: 40
                    high_limit: 50
        count:
            data:
                -
                    oid: RF-POWER-MONITOR-MIB::mainsPowerChanges
                    num_oid: '.1.3.6.1.4.1.63050.2.{{ $index }}'
                    descr: 'Mains power changes since boot'
                    index: 'mainsPowerChanges.{{ $index }}'
