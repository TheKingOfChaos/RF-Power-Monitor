; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   pico    Firmware for the Raspberry Pi Pico, and on-device tests (test/embedded)
;   native  Host unit tests for hardware-independent code (test/native)
;
; See docs/TESTING.md for how to run the tests.

[platformio]
; A bare `pio run`, `pio test` or upload builds pico only. pico_b (the same firmware linked
; for slot B) is built by tools/fw_release.py with -e pico_b and is refused by upload
default_envs = pico
; Per-PC overrides (e.g. upload_port, monitor_port, test_port under [env:pico]),
; gitignored. The glob matches nothing when the file is absent
extra_configs = platformio.local*.ini

[env]
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:pico]
; Pinned (2026-02-01): Arduino-Pico 5.4.3, lwIP 2.2.1, GCC 14.2. Without the pin a fresh install
; takes the platform's newest commit (6.x, GCC 16), which changes stack use. Update on purpose,
; then re-measure the stacks and run every test layer.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#24f5f5b668907cddae741529a40d344de5a5cf19
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 0.25m
board_build.filesystem_dir = data

test_filter = embedded/*
test_build_src = no

; Keep the core's default -Os. Building without optimization (-O0) more than
; doubles stack use, and core 0 has only 8 KB of stack.
; Make include/pins.h visible to libraries too (lib/mains_input)
; IPv4 + IPv6 (dual stack). lwIP is compiled from source with these flags.
; lwIP sizes its timer pool without room for mDNS (its docs ask for more);
; with IPv6, mDNS runs its timers for both IP versions and the pool ran empty
; seconds after boot (lwIP assert -> panic). 12 more slots cost ~200 bytes.
; No parentheses around the sum: on Linux (CI) the compiler runs through sh,
; which rejects "(". lwIP puts its own parentheses around every use.
;
; LWIP_IPV6_FRAG=0: the core's UdpContext marks a helper pbuf between queued
; UDP packets with flags 0xFF, which includes PBUF_FLAG_IS_CUSTOM. IPv6
; fragmentation switches on custom pbufs (LWIP_SUPPORT_CUSTOM_PBUF), and then
; freeing that helper jumps to garbage: two SNMP requests back to back crashed
; the device. Without IPv6 fragmentation custom pbufs are off, as in the IPv4
; build. The device never needs to fragment: IPv6 SNMP replies are kept <= 1452
; bytes (src/snmp_service.cpp), the web page uses TCP.
;
; Static IPv6 (src/ipv6_static.cpp): 4 address slots (link-local, static and
; two router-advertised prefixes; lwIP's default is 3), and the lwIP hook in
; include/lwip_hooks.h that makes the static IPv6 gateway the next hop.
;
; SO_REUSE=1: the web server's socket asks for SOF_REUSEADDR (the core's
; WiFiServer sets it), but lwIP ignores that without SO_REUSE. A connection the
; device closed after reading a whole request (a login POST) then sits in
; TIME-WAIT on port 80 for 2 minutes, and turning the web interface off and on
; could not open the port again in that time.
;
; NTP (src/time_service.cpp): lwIP's SNTP client asks every 15 minutes, and
; takes its servers from DHCP option 42 and DHCPv6 option 56 when the setting
; is dhcp. SNTP adds a timer: 14 instead of 12 extra timer slots.
build_flags =
    -I include
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_IPV6
    -D MEMP_NUM_SYS_TIMEOUT=LWIP_NUM_SYS_TIMEOUT_INTERNAL+14
    -D LWIP_IPV6_FRAG=0
    -D LWIP_IPV6_NUM_ADDRESSES=4
    '-D LWIP_HOOK_FILENAME="lwip_hooks.h"'
    -D SO_REUSE=1
    -D SNTP_UPDATE_DELAY=900000
    -D LWIP_DHCP_GET_NTP_SRV=1
    -D LWIP_DHCP6_GET_NTP_SRV=1

upload_port = COM16
monitor_port = COM16
monitor_speed = 115200
test_port = COM16
test_speed = 115200
; Firmware slot (scripts/slot_build.py): 0 = slot A at flash 0x10000, 1 = slot B
; at 0xE7000. The image is linked at slot + 0x100 and started by our boot program
; (boot/) at flash 0. Upload and `pio test` send firmware_full.uf2 (boot program
; and slot A image).
custom_fw_slot = 0
; slot_build.py runs before (linker script, FW_SLOT) and after (UF2, upload) the
; core's builder. Then wait for the USB serial port to return after flashing,
; so `pio test` can open it
extra_scripts =
    pre:scripts/slot_build.py
    post:scripts/slot_build.py
    post:scripts/wait_for_port.py

[env:pico_b]
; The same firmware linked for slot B (0xE7000). Built for firmware updates;
; it is not uploaded over USB (the boot program starts slot A)
extends = env:pico
custom_fw_slot = 1

[env:native]
platform = native
test_filter = native/*
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
; Only the hardware-independent libraries build on the host
lib_ignore =
    settings
    mains_input
