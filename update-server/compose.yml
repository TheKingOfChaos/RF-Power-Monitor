# RF-Power-Monitor update site. Start: docker compose up -d --build (from this folder)
# Set the admin password in compose.override.yml (gitignored), e.g.
#   services:
#     rfupdate:
#       environment:
#         RFUPDATE_ADMIN_PASSWORD: "a long password"
services:
  rfupdate:
    build: .
    image: rfupdate:local
    container_name: rfupdate
    ports:
      # host port: RFUPDATE_PORT in .env (gitignored), default 8071
      - "${RFUPDATE_PORT:-8071}:8071"
    volumes:
      - rfupdate-data:/data
    restart: unless-stopped

volumes:
  rfupdate-data:
